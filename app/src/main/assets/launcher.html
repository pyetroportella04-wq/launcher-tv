<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launcher TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
@property --g1{syntax:'<color>';inherits:true;initial-value:#5b3df5}
@property --g2{syntax:'<color>';inherits:true;initial-value:#ff5fa2}
:root{
  --bg:#171230;--ink:#f4f0ff;--ink2:#d2caee;--chip:rgba(255,255,255,.1);--shade:rgba(10,6,28,.55);--glass:rgba(22,15,46,.42);--edge:rgba(255,255,255,.16);
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:--g1 .9s ease,--g2 .9s ease;color-scheme:dark;
}
:root[data-theme="dark"]{--bg:#171230;--ink:#f4f0ff;--ink2:#b9b0d9;--chip:rgba(255,255,255,.1);--shade:rgba(10,6,28,.55)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 70% at 78% 8%,var(--g1),transparent 70%),radial-gradient(55% 60% at 8% 100%,var(--g2),transparent 70%);opacity:.3}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,6,28,.3),transparent 30%,var(--shade))}
.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:clamp(20px,3.5vw,56px) 0 clamp(16px,2vw,32px)}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:0 clamp(20px,4.5vw,80px)}
.clock{font-size:clamp(40px,5vw,84px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.date{margin-top:8px;color:var(--ink2);font-size:clamp(15px,1.5vw,24px)}
.hello{font-size:clamp(15px,1.5vw,24px);color:var(--ink2);text-align:right}
.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,5vh,72px) clamp(20px,4.5vw,80px) clamp(20px,3vh,40px);min-height:200px}
.hero h1{font-size:clamp(44px,8vw,128px);font-weight:700;letter-spacing:-.045em;line-height:.95;font-variation-settings:'wdth' 90}
.hero p{margin-top:14px;max-width:34ch;font-size:clamp(17px,1.9vw,30px);line-height:1.35;color:var(--ink2)}
.row-title{padding:0 clamp(20px,4.5vw,80px);margin:clamp(8px,1.5vh,20px) 0 12px;font-size:clamp(14px,1.4vw,22px);font-weight:600;color:var(--ink2)}
.row{display:flex;gap:clamp(14px,1.6vw,26px);overflow-x:hidden;margin:0 clamp(20px,4.5vw,80px);padding:18px clamp(14px,2vw,30px) 22px;border-radius:34px;scroll-padding:0 clamp(14px,2vw,30px)}
.tile{flex:none;position:relative;border:0;border-radius:26px;color:#fff;cursor:pointer;font:inherit;text-align:left;overflow:hidden;
  background:linear-gradient(145deg,var(--c1),var(--c2));background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 64%,transparent),color-mix(in srgb,var(--c2) 72%,transparent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);outline:none;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.app{width:clamp(120px,12vw,200px);aspect-ratio:1;padding:clamp(14px,1.4vw,22px);display:flex;flex-direction:column;justify-content:space-between}
.app svg{width:42%;height:auto;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app span{font-weight:600;font-size:clamp(14px,1.4vw,22px);position:relative;z-index:1}
.rec{width:clamp(210px,21vw,340px);aspect-ratio:16/9;padding:clamp(12px,1.2vw,20px);display:flex;flex-direction:column;justify-content:flex-end}
.rec b{font-size:clamp(15px,1.5vw,24px);font-weight:700;position:relative;z-index:1}
.rec small{font-size:clamp(12px,1.1vw,17px);opacity:.85;position:relative;z-index:1;margin-top:2px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:10px;position:relative;z-index:1}
.bar i{display:block;height:100%;border-radius:inherit;background:#fff}
.tile.on,.tile:focus-visible{transform:scale(1.1);z-index:2;box-shadow:0 0 0 4px var(--ink),0 22px 60px -8px var(--c1)}
.keys{display:flex;gap:22px;flex-wrap:wrap;padding:6px clamp(20px,4.5vw,80px) 0;font-size:clamp(12px,1.1vw,16px);color:var(--ink2)}
.keys kbd{font:inherit;font-weight:600;background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:8px;margin-right:6px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;z-index:5;
  background:var(--ink);color:var(--bg);font-weight:600;padding:12px 22px;border-radius:999px;transition:all .25s ease;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

tv:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
live:'<circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9M4.5 4.5a10 10 0 000 15M19.5 4.5a10 10 0 010 15"/>',
music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
game:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.5" cy="14" r=".8"/>',
photo:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-2 6 4"/>',
web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
play:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/>',
cast:'<path d="M3 8V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2h-6M3 12a8 8 0 018 8M3 16a4 4 0 014 4"/>'};
const apps=[
{n:'Netflix',d:'Filmes, séries e documentários.',a:'#e5333b',b:'#6e0a12',i:'film'},
{n:'YouTube',d:'Vídeos, canais e lives na tela grande.',a:'#ff4a3d',b:'#9c1010',i:'play'},
{n:'Spotify',d:'Suas playlists e podcasts na sala.',a:'#22d664',b:'#0b5f37',i:'music'},
{n:'Prime Video',d:'Lançamentos e os seus títulos salvos.',a:'#27b4ff',b:'#0a4585',i:'tv'},
{n:'Globoplay',d:'Novelas, jornais e programas ao vivo.',a:'#ff6a3d',b:'#a82a68',i:'live'},
{n:'Disney+',d:'Animações, Marvel e Star Wars.',a:'#4a63ff',b:'#1a1c88',i:'photo'},
{n:'Midiacast',d:'Envie o celular para a TV.',a:'#3aa0ff',b:'#2438b0',i:'cast'},
{n:'Ajustes',d:'Rede, som, imagem e contas.',a:'#8d8aa8',b:'#4c4870',i:'set'}];
const PK={Netflix:['com.netflix.ninja'],YouTube:['com.google.android.youtube.tv'],Spotify:['com.spotify.tv.android'],'Prime Video':['com.amazon.amazonvideo.livingroom'],Globoplay:['com.globo.globotv'],'Disney+':['com.disney.disneyplus'],Midiacast:[]};
const recs=[
{n:'Noite em Lisboa',d:'Filme, 1 h 12 min restantes',p:35,a:'#ff7a45',b:'#a3224f'},
{n:'Cozinha de Domingo',d:'Série, temporada 2 episódio 4',p:70,a:'#8a5cff',b:'#3a2ab5'},
{n:'Clássico de Domingo',d:'Ao vivo, segundo tempo',p:55,a:'#18c28f',b:'#0a6b78'},
{n:'Trilhas do Sul',d:'Documentário, 24 min restantes',p:82,a:'#3fa0ff',b:'#2b3fb8'},
{n:'Álbum de Verão',d:'Música, faixa 6 de 12',p:48,a:'#ffb02e',b:'#d4472a'}];
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SNAP={name:'GP do México',circuit:'Autódromo Hermanos Rodríguez',s:[['Treino livre 1','FP','2026-10-30T18:30:00Z'],['Treino livre 2','FP','2026-10-30T22:00:00Z'],['Treino livre 3','FP','2026-10-31T17:30:00Z'],['Classificação','Q','2026-10-31T21:00:00Z'],['Corrida','R','2026-11-01T20:00:00Z']]};
const KIND={FP:{m:60,a:'#e8334a',b:'#6b1024'},SQ:{m:45,a:'#ff6a3d',b:'#8a1f3b'},SP:{m:45,a:'#ff6a3d',b:'#8a1f3b'},Q:{m:60,a:'#ff9330',b:'#a3341a'},R:{m:120,a:'#ff2e4d',b:'#3d0a24'}};
const PAIS={Australia:'da Austrália',China:'da China',Japan:'do Japão',Bahrain:'do Bahrein','Saudi Arabia':'da Arábia Saudita',Canada:'do Canadá',Monaco:'de Mônaco',Spain:'da Espanha',Austria:'da Áustria',UK:'da Grã-Bretanha',Belgium:'da Bélgica',Hungary:'da Hungria',Netherlands:'da Holanda',Italy:'da Itália',Azerbaijan:'do Azerbaijão',Singapore:'de Singapura',Mexico:'do México',Brazil:'de São Paulo',Qatar:'do Catar',UAE:'de Abu Dhabi'};
let gp=[];
const head={n:'Fórmula 1',span:'',d:'',a:'#3a3a52',b:'#0f0f1c',head:1};
const rows=[[
 {n:'Bluetooth',d:'Parear fones, controles e caixas de som.',a:'#2f7bff',b:'#12338f',i:'bt',act:'android.settings.BLUETOOTH_SETTINGS',br:'openBluetoothSettings'},
 {n:'Configurações',d:'Rede, imagem, som e contas da TV.',a:'#8d8aa8',b:'#4c4870',i:'cog',act:'android.settings.SETTINGS',br:'openSettings'}],
 apps,[head],recs.map(r=>({n:r.n,d:r.d,a:r.a,b:r.b}))];
const els=[[],[],[],[]];let R=1,C=0;
const root=document.documentElement;
function inner(kind,x,ci){
  if(kind==='app')return '<svg viewBox="0 0 24 24" aria-hidden="true">'+I[x.i]+'</svg><span>'+x.n+'</span>';
  if(kind==='bt')return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(x.i==='cog'?'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.5v2.9M12 18.6v2.9M2.5 12h2.9M18.6 12h2.9M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/>':'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>')+'</svg>';
  if(kind==='f1')return x.head?'<small>Fórmula 1</small><b>'+x.n+'</b><em>'+x.span+'</em>':'<small>'+x.n+'</small><b>'+x.time+'</b><em class="cd">'+x.day+'</em>';
  return '<b>'+x.n+'</b><small>'+x.d+'</small><div class="bar"><i style="width:'+recs[ci].p+'%"></i></div>'}
function mk(list,host,kind,ri){list.forEach((x,ci)=>{
  const t=document.createElement('button');t.className='tile '+kind+(x.head?' head':'');t.setAttribute('role','listitem');
  if(kind==='bt')t.setAttribute('aria-label',x.n);
  t.style.setProperty('--c1',x.a);t.style.setProperty('--c2',x.b);
  t.innerHTML=inner(kind,x,ci);
  t.addEventListener('click',()=>{go(ri,ci);open_()});t.addEventListener('mouseenter',()=>go(ri,ci,true));
  host.appendChild(t);els[ri].push(t)})}
mk(rows[0],document.getElementById('btHost'),'bt',0);
mk(apps,document.getElementById('r0'),'app',1);
mk(recs,document.getElementById('r1'),'rec',3);
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function go(r,c,quiet){
  els[R][C].classList.remove('on');R=r;C=Math.max(0,Math.min(c,els[r].length-1));
  const t=els[R][C],x=rows[R][C];t.classList.add('on');
  if(!quiet)t.focus({preventScroll:true});
  t.scrollIntoView({inline:'center',block:'nearest',behavior:calm?'auto':'smooth'});
  document.getElementById('hName').textContent=x.n;
  document.getElementById('hDesc').textContent=x.d;
  root.style.setProperty('--g1',x.a);root.style.setProperty('--g2',x.b);
  try{localStorage.setItem('ltv2',R+','+C)}catch(e){}
}
const toast=document.getElementById('toast');let tm;
function say(m,ms){toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('show'),ms||1600)}
function openSys(x){say('Abrindo '+x.n+'…');
  try{if(window.Android&&Android[x.br]){Android[x.br]();return}
  location.href='intent:#Intent;action='+x.act+';end'}catch(e){}
  setTimeout(()=>{if(document.visibilityState==='visible')say('Esse atalho funciona quando o launcher é instalado como app Android.',3800)},1400)}
function open_(){if(R===0)return openSys(rows[0][C]);
  if(R===1){const x=rows[1][C];
    if(x.i==='set')return openSys({n:'Ajustes',br:'openSettings',act:'android.settings.SETTINGS'});
    if(window.Android&&Android.launchApp){
      if(x.pkg){Android.launchApp(x.pkg);return say('Abrindo '+x.n+'…')}
      return say(x.n+' não está instalado nesta TV.',2600)}}
  if(R===2)return say(rows[R][C].d,3600);say('Abrindo '+rows[R][C].n+'…')}
function brt(iso){const d=new Date(new Date(iso).getTime()-1.08e7);return{w:WD[d.getUTCDay()],d:d.getUTCDate(),mo:MO[d.getUTCMonth()],hh:String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}}
function setGP(info){
  gp=info.s.map(x=>{const t=brt(x[2]);return Object.assign({n:x[0],t:x[2]},KIND[x[1]],{time:t.hh,day:t.w.slice(0,3)+', '+t.d+' '+t.mo,
    d:t.w[0].toUpperCase()+t.w.slice(1)+', '+t.d+' de '+t.mo+', às '+t.hh+' (horário de Brasília)'})});
  const f=brt(info.s[0][2]),l=brt(info.s[info.s.length-1][2]);
  head.n=info.name;head.span=f.d+' '+f.mo+' a '+l.d+' '+l.mo;
  head.d=info.circuit+', de '+head.span+'. Horários no fuso de Brasília.';
  rows[2]=[head].concat(gp);
  const host=document.getElementById('rf');host.innerHTML='';els[2]=[];mk(rows[2],host,'f1',2);
  if(R===2){C=Math.min(C,els[2].length-1);go(2,C,true)}
  f1tick(new Date())}
function f1tick(d){const now=d.getTime();let nx=false;
  gp.forEach((s,i)=>{const t=new Date(s.t).getTime(),el=els[2][i+1];if(!el)return;
    const cd=el.querySelector('.cd'),done=now>t+s.m*6e4,live=now>=t&&!done;
    el.classList.toggle('done',done);el.classList.remove('next');
    if(!nx&&!done){nx=true;el.classList.add('next');const m=Math.max(0,Math.round((t-now)/6e4));
      cd.textContent=live?'ao vivo agora':m>=1440?'em '+Math.floor(m/1440)+' d '+Math.floor(m%1440/60)+' h':m>=60?'em '+Math.floor(m/60)+' h '+m%60+' min':'em '+m+' min'}
    else cd.textContent=s.day});
  if(!nx&&Date.now()-lastTry>6e5)loadF1()}
let lastTry=0;
function gpName(r){const L=r.Circuit.Location,c=L.country;return 'GP '+(c==='USA'?'de '+L.locality:(PAIS[c]||'de '+L.locality))}
async function loadF1(){
  lastTry=Date.now();
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),7000);
    const r=await fetch('https://api.jolpi.ca/ergast/f1/current.json?limit=40',{signal:ac.signal});clearTimeout(to);
    const j=await r.json(),now=Date.now();
    for(const race of j.MRData.RaceTable.Races){
      const s=[],add=(n,k,o)=>{if(o&&o.date){let tm=o.time||'12:00:00Z';if(!/Z$/.test(tm))tm+='Z';s.push([n,k,o.date+'T'+tm])}};
      add('Treino livre 1','FP',race.FirstPractice);add('Treino livre 2','FP',race.SecondPractice);add('Treino livre 3','FP',race.ThirdPractice);
      add('Classificação sprint','SQ',race.SprintQualifying||race.SprintShootout);add('Sprint','SP',race.Sprint);
      add('Classificação','Q',race.Qualifying);add('Corrida','R',race);
      s.sort((x,y)=>new Date(x[2])-new Date(y[2]));
      if(s.length>1&&new Date(s[s.length-1][2]).getTime()+72e5>now){
        const info={name:gpName(race),circuit:race.Circuit.circuitName,s:s};
        setGP(info);try{localStorage.setItem('f1c',JSON.stringify(info))}catch(e){}return}
    }
  }catch(e){}
}
addEventListener('keydown',e=>{
  const k=e.key,m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[k];
  if(m){e.preventDefault();
    if(m[0]){const nr=R+m[0];if(nr>=0&&nr<rows.length)go(nr,Math.min(C,rows[nr].length-1))}
    else go(R,C+m[1])}
  else if(k==='Enter'||k===' '){e.preventDefault();open_()}
  else if(k==='Escape'||k==='Backspace'){go(1,0)}
});
function tick(){const d=new Date(),h=d.getHours();
  document.getElementById('clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  f1tick(d)}
function useIcons(){
  if(!(window.Android&&Android.resolveApps))return;
  try{
    const q=apps.filter(a=>a.i!=='set').map(a=>({n:a.n,pk:PK[a.n]||[]}));
    JSON.parse(Android.resolveApps(JSON.stringify(q))).forEach(x=>{
      const i=apps.findIndex(a=>a.n===x.n);if(i<0)return;const t=els[1][i];
      if(!x.pkg){t.classList.add('off');return}
      apps[i].pkg=x.pkg;
      if(x.icon){const im=new Image();im.src=x.icon;im.alt='';const s=t.querySelector('svg');if(s)s.replaceWith(im)}})
  }catch(e){}}
useIcons();
let info=SNAP;try{const c=JSON.parse(localStorage.getItem('f1c')||'null');
  if(c&&c.s&&new Date(c.s[c.s.length-1][2]).getTime()+72e5>Date.now())info=c}catch(e){}
setGP(info);loadF1();setInterval(loadF1,216e5);
tick();setInterval(tick,20000);
let s=[1,0];try{const v=(localStorage.getItem('ltv2')||'').split(',').map(Number);if(v.length===2&&!v.some(isNaN))s=v}catch(e){}
go(Math.min(s[0],3),s[1],true);
</script>
